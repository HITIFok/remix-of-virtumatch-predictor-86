<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>VirtuMatch Predictor - Prédictions Instant League</title>
    <meta name="description" content="Application de prédiction de matchs virtuels Instant League - Pronostics intelligents basés sur les statistiques" />
    <meta name="author" content="VirtuMatch" />

    <meta property="og:title" content="VirtuMatch Predictor" />
    <meta property="og:description" content="Prédictions de matchs virtuels Instant League avec analyses statistiques avancées" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VirtuMatch Predictor" />
    <meta name="twitter:description" content="Prédictions de matchs virtuels Instant League" />
    
    <style>
      /* Loading state */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #loading .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #loading p {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      /* Error state */
      #error {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #1a1a2e;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 20px;
        z-index: 10000;
      }
      #error.show { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #error h2 { color: #f97316; margin-bottom: 10px; }
      #error p { opacity: 0.8; text-align: center; max-width: 400px; }
    </style>
  </head>

  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Chargement de VirtuMatch...</p>
    </div>
    
    <div id="error">
      <h2>⚠️ Erreur de chargement</h2>
      <p>L'application n'a pas pu se charger correctement.<br>Vérifiez votre connexion et réessayez.</p>
      <p style="margin-top: 20px; font-size: 12px; opacity: 0.6;" id="error-detail"></p>
    </div>
    
    <div id="root"></div>
    
    <!-- Vite entry point - REQUIRED for build -->
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loading after app mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loading = document.getElementById('loading');
          if (loading) loading.style.display = 'none';
        }, 500);
      });
      
      // Show error if JS fails
      window.onerror = function(msg, url, line) {
        var loading = document.getElementById('loading');
        var error = document.getElementById('error');
        var errorDetail = document.getElementById('error-detail');
        if (loading) loading.style.display = 'none';
        if (error) error.classList.add('show');
        if (errorDetail) errorDetail.textContent = msg + ' (' + line + ')';
        return false;
      };
    </script>
  </body>
</html>
