<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VirtuXXS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="VirtuXXS" />
    <meta name="msapplication-TileColor" content="#0a0a0d" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="1024x1024" href="/icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    
    <title>VirtuXXS - Prédictions Sportives</title>
    <meta name="description" content="Application de prédiction sportive garantie par algorithme - Pronostics intelligents basés sur les statistiques" />
    <meta name="author" content="HITIF" />

    <!-- Open Graph -->
    <meta property="og:title" content="VirtuXXS - Prédictions Sportives" />
    <meta property="og:description" content="Prédictions sportives avec analyses statistiques avancées et algorithme garanti" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VirtuXXS - Prédictions Sportives" />
    <meta name="twitter:description" content="Prédictions sportives avec algorithme garanti" />
    
    <style>
      /* Loading state */
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a0a0d 0%, #1a0a1a 50%, #0a0f1a 100%);
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        z-index: 9999;
      }
      #loading .logo {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        animation: pulse 2s ease-in-out infinite;
      }
      #loading .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #ff6b35;
        border-right-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #loading p {
        margin-top: 20px;
        font-size: 14px;
        opacity: 0.8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      /* Error state */
      #error {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #0a0a0d;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 20px;
        z-index: 10000;
      }
      #error.show { display: flex; flex-direction: column; align-items: center; justify-content: center; }
      #error h2 { color: #ff6b35; margin-bottom: 10px; }
      #error p { opacity: 0.8; text-align: center; max-width: 400px; }
    </style>
  </head>

  <body>
    <div id="loading">
      <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ff6b35"/>
            <stop offset="100%" style="stop-color:#f7931e"/>
          </linearGradient>
          <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#38bdf8"/>
            <stop offset="100%" style="stop-color:#0ea5e9"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#fireGrad)" opacity="0.2"/>
        <text x="50" y="60" text-anchor="middle" fill="url(#fireGrad)" font-size="32" font-weight="bold" font-family="system-ui">VX</text>
      </svg>
      <div class="spinner"></div>
      <p>Chargement...</p>
    </div>
    
    <div id="error">
      <h2>⚠️ Erreur de chargement</h2>
      <p>L'application n'a pas pu se charger correctement.<br>Vérifiez votre connexion et réessayez.</p>
      <p style="margin-top: 20px; font-size: 12px; opacity: 0.6;" id="error-detail"></p>
    </div>
    
    <div id="root"></div>
    
    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loading after app mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loading = document.getElementById('loading');
          if (loading) loading.style.display = 'none';
        }, 500);
      });
      
      // Show error if JS fails
      window.onerror = function(msg, url, line) {
        var loading = document.getElementById('loading');
        var error = document.getElementById('error');
        var errorDetail = document.getElementById('error-detail');
        if (loading) loading.style.display = 'none';
        if (error) error.classList.add('show');
        if (errorDetail) errorDetail.textContent = msg + ' (' + line + ')';
        return false;
      };
    </script>
  </body>
</html>
