name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Créer le fichier .env.local avec les secrets
      - name: Setup environment variables
        run: |
          echo "VITE_DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.local
          echo "VITE_DATABASE_ANON_KEY=${{ secrets.DATABASE_ANON_KEY }}" >> .env.local
          echo "Environment configured"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync Capacitor
        run: npx cap sync android

      # Generate release keystore for consistent signing
      - name: Generate release keystore
        working-directory: android
        run: |
          # Generate keystore with fixed credentials for consistent signing
          keytool -genkeypair \
            -v \
            -keystore release-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias virutelbet261 \
            -storepass virutel2024secure \
            -keypass virutel2024secure \
            -dname "CN=Virutel Bet261, OU=HITIF, O=HITIF, L=Antananarivo, ST=Antananarivo, C=MG"
          
          # Create keystore.properties for Gradle (in android/ folder, relative path)
          echo "storeFile=release-keystore.jks" > keystore.properties
          echo "storePassword=virutel2024secure" >> keystore.properties
          echo "keyAlias=virutelbet261" >> keystore.properties
          echo "keyPassword=virutel2024secure" >> keystore.properties
          
          echo "Keystore generated successfully"

      - name: Build Signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify APK signature
        working-directory: android
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk || true
          echo "APK built and signed successfully"

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/virutel-bet261.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: virutel-bet261-apk
          path: android/app/build/outputs/apk/release/virutel-bet261.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Virutel Bet261 Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/release/virutel-bet261.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
