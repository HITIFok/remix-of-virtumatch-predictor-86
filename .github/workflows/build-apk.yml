name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissions minimales - principe du moindre privilège
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        run: |
          echo "VITE_DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.production
          echo "VITE_DATABASE_ANON_KEY=${{ secrets.DATABASE_ANON_KEY }}" >> .env.production

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storeFile=app/release-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=virutelbet261
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK
        run: |
          echo "=== Listing APK outputs ==="
          find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || echo "No APK found in outputs"
          echo "=== Listing all build outputs ==="
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "No outputs dir"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virutel-bet261-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/release-keystore.jks
          rm -f android/keystore.properties
