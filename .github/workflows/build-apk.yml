name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy 'tools' package was removed from Google's SDK repository
          # in 2023. Specifying only the packages we need avoids the
          # "Failed to find package 'tools'" error.
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'

      - name: Install dependencies
        run: npm ci

      - name: Create environment file
        run: |
          echo "VITE_API_BASE=${{ secrets.VITE_API_BASE }}" > .env.production

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks

      - name: Create keystore.properties
        run: |
          printf 'storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=virutelbet261\nkeyPassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEYSTORE_PASSWORD }}" > android/keystore.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Find APK files
        run: find android/app/build/outputs -name "*.apk" -type f

      - name: Upload APK as artifact (temporary, for CI use)
        uses: actions/upload-artifact@v4
        with:
          name: virutel-apk
          path: android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APK as GitHub Release (permanent, public download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: VirtuMatch APK (latest)
          body: "Dernier build de l'APK VirtuMatch — généré automatiquement à chaque push sur main."
          files: android/app/build/outputs/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Move apk-latest tag to current commit
        # Phase 5.3.53 — fix the apk-latest tag drift.
        # softprops/action-gh-release@v2 UPDATES the release assets + body when
        # a release with the given tag_name already exists, but does NOT move
        # the underlying git tag pointer. As a result, the release page shows
        # the fresh APK (uploaded as a new asset) while refs/tags/apk-latest
        # stays pointing at the original commit (545321e, 2026-09-08).
        # This step force-moves the tag to the commit the APK was actually
        # built from (github.sha), keeping the tag in sync with the release.
        # The workflow has permissions: contents: write (line 13) so the push
        # succeeds. The previous step's success implies the APK exists.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f apk-latest "${{ github.sha }}"
          git push -f origin refs/tags/apk-latest

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/release-keystore.jks android/keystore.properties
