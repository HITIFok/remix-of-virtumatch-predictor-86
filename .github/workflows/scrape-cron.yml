name: Scrape All Leagues

on:
  schedule:
    # Every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper (all leagues)
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_KEY: ${{ secrets.SCRAPER_PUSH_KEY }}
          SPORTY_API_BASE: ${{ secrets.SPORTY_API_BASE }}
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
          API_REFERER: ${{ secrets.API_REFERER }}
          API_APP_VERSION: ${{ secrets.API_APP_VERSION }}
        run: python3 scripts/scraper-all-leagues.py
